name: Publicar o site

# Publica o portal no GitHub Pages por um workflow próprio, em vez do
# "pages build and deployment" automático. Motivo (09/11/2026): o automático
# manda o repositório inteiro (estava com 2,5 GB) e tem tempo fixo de 10 min
# para o deploy, que vinha estourando ("Timeout reached, aborting!").
# Aqui:
#   - ficam de fora o que nenhuma página usa: img/banco (fotos de origem das
#     artes), scripts/ e .github/;
#   - o deploy pode levar até 30 min.
# Se precisar voltar ao automático: Settings > Pages > Source: Deploy from a branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages          # um deploy por vez; o mais novo da fila substitui os outros
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Montar a pasta do site
        run: |
          mkdir -p ../_site
          rsync -a ./ ../_site/ \
            --exclude '.git' --exclude '.github' \
            --exclude 'scripts' --exclude 'img/banco'
          mv ../_site ./_site
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
