name: Atualizar Shorts do portal

on:
  schedule:
    # a cada 20 minutos: o Short novo aparece no portal logo depois de subir no YouTube
    # (o repositorio e publico, entao as execucoes nao tem custo; so publica se algo mudou)
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-shorts
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar os shorts mais recentes
        run: python3 scripts/atualizar_shorts.py

      - name: Garantir a tag do Analytics em todas as paginas
        run: python3 scripts/aplicar_ga.py

      - name: Publicar se algo mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Portal Junior Arrais"
            git config user.email "juniorarrais90@gmail.com"
            git add -A
            git commit -m "Atualiza os Shorts e a tag do Analytics"
            git pull --rebase -q
            git push
          else
            echo "Nada mudou."
          fi
